kind = "web"
previewPath = "/uns-landing/"
title = "UNS Landing Page"
version = "1.0.0"
id = "artifacts/uns-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/uns-landing/" ]
localPort = 20211

[services.development]
run = "pnpm --filter @workspace/uns-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uns-landing", "run", "build" ]
publicDir = "artifacts/uns-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20211"
BASE_PATH = "/uns-landing/"
